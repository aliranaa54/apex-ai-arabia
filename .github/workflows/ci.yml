name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -v

  build:
    needs: test            # no green tests, no image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image tagged with the commit
        run: docker build -t apex-ops-api:${{ github.sha }} --build-arg APP_VERSION=${{ github.sha }} .
      - name: Scan image (fails on HIGH/CRITICAL that have a fix)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.24.0, pinned to a commit
        with:
          image-ref: apex-ops-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test with compose
        run: |
          cp .env.example .env
          APP_VERSION=${{ github.sha }} docker compose up -d --build
          for i in $(seq 1 30); do curl -fs localhost:8000/readyz && break; sleep 2; done
          curl -fs localhost:8000/readyz
          docker compose down -v

  deploy:
    needs: build           # only runs if test AND build passed
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: local-demo
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (demo)
        run: |
          echo "Real deploy would push the image to a registry and run scripts/release.sh on the server."
          echo "Locally this step is done by hand: scripts/release.sh <version>"
